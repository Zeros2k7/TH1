[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:adc1]
; VD1 chuan: GPIO34 (ADC1_CH6)

[env:adc2]
; Thuc hanh: GPIO15 (ADC2_CH3, strapping) - Wi-Fi tat
build_flags = -DUSE_ADC2

[env:adc2_wifi]
; ADC2 + bat Wi-Fi -> analogRead loi
build_flags = -DUSE_ADC2 -DUSE_WIFI
